# The corpus a RAG system would retrieve over: an advice firm's policy handbook.
#
# Sixteen chunks, written to make retrieval genuinely non-trivial rather than to
# flatter it. Three properties are deliberate:
#
#   * NEAR-DUPLICATES. p02 and p03 both talk about cancelling; only one of them
#     applies to a portfolio above the fee threshold. A retriever that scores on
#     surface overlap returns both, and a generator that reads the wrong one
#     produces a confident, well-grounded, wrong answer. That is the failure
#     this corpus exists to expose.
#   * CONTRADICTION BAIT. p13 says introductory credits may NOT be used against
#     the advance fee. A support check that works on word overlap cannot see the
#     negation, which is why the offline stand-in in ragcheck/offline.py gets it
#     wrong and its calibration report says so out loud.
#   * SPLIT ANSWERS. c18 needs p01 for the fee and p02 for the window. No single
#     chunk answers it, so recall@1 is 0.5 at best — the shape of question that
#     makes k a design decision rather than a default.
#
# Everything here is invented. It is a policy handbook for an advice firm that
# does not exist, in the same domain as the rest of this repository.

doc: "Client policy handbook, an advice firm that does not exist (fictional), rev 7"

chunks:
  - id: p01
    title: Advance fee for larger portfolios
    section: "2.1 Fees"
    text: >-
      Portfolios of eight hundred thousand or more require an advance advice fee
      of GBP 15 per ten thousand invested, taken at the time of the
      recommendation. The fee is offset against the first annual charge.

  - id: p02
    title: Cancellation window
    section: "2.2 Cancellations"
    text: >-
      An engagement may be cancelled free of charge up to 48 hours before the
      recommendation is issued. Inside 48 hours the advance fee is retained in
      full.

  - id: p03
    title: Cancellation for smaller portfolios
    section: "2.2 Cancellations"
    text: >-
      Portfolios below eight hundred thousand carry no advance fee, so there is
      nothing to forfeit and no charge for cancelling at any notice.

  - id: p04
    title: Late arrival
    section: "3.1 Service"
    text: >-
      Advice appointments are held for 20 minutes past the booked time. After 20
      minutes the slot may be released to the waiting list.

  - id: p05
    title: Vulnerability notes
    section: "4.1 Vulnerability"
    text: >-
      Every vulnerability note must be entered on the client record and repeated
      to the adviser at the meeting. The firm does not guarantee a specialist
      adviser is available.

  - id: p06
    title: Vulnerability register
    section: "4.2 Vulnerability"
    text: >-
      A full fourteen-indicator vulnerability register is available on request;
      the compliance officer keeps the current version.

  - id: p07
    title: The Discretionary Service
    section: "5.1 Discretionary"
    text: >-
      The Discretionary Service takes up to 22 model portfolios and is charged on
      a minimum-fee basis rather than a per-holding fee. The minimum fee is GBP
      900 a quarter.

  - id: p08
    title: Advice line hours
    section: "1.1 Hours"
    text: >-
      The advice line runs Tuesday to Sunday, 12:00 to 14:30 and 18:00 to 22:00.
      The line closes to new enquiries 30 minutes before the end of each session.

  - id: p09
    title: Monday closure
    section: "1.2 Hours"
    text: >-
      The advice line is closed on Mondays, including bank holidays.

  - id: p10
    title: Third-party authority
    section: "3.4 Authority"
    text: >-
      Registered attorneys may act throughout. Other third parties may act on
      written authority only.

  - id: p11
    title: Junior accounts
    section: "3.5 Accounts"
    text: >-
      Junior accounts are available, two per household, so they are allocated in
      application order. Junior portfolios are offered from the main model range
      at half the annual charge.

  - id: p12
    title: Identity checks
    section: "3.6 Onboarding"
    text: >-
      There is no in-person identity check anywhere in the onboarding process.
      Clients are asked to avoid scanned photographs for the Discretionary
      Service.

  - id: p13
    title: Introductory credits
    section: "2.4 Payment"
    text: >-
      Introductory credits are valid for 12 months from issue and may be used
      against the annual charge only. Credits may not be used to pay an advance
      fee.

  - id: p14
    title: Model range
    section: "5.2 Larger portfolios"
    text: >-
      Portfolios of twelve or more holdings are built from a fixed model range,
      chosen at least 72 hours in advance.

  - id: p15
    title: Amendments
    section: "2.3 Amendments"
    text: >-
      An engagement may be moved once free of charge, provided the new date is
      within 30 days and the request arrives more than 48 hours ahead.

  - id: p16
    title: Non-attendance
    section: "2.5 Non-attendance"
    text: >-
      A non-attendance forfeits the advance fee in full and is recorded on the
      client's profile.
