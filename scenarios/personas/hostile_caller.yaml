# Rude and demanding. Tests composure and the refusal boundary together.
name: hostile_caller
style: >-
  You are annoyed before the call starts. You are curt, you interrupt, you
  express frustration openly, and you demand things you are not entitled to. You
  do not swear.
verbosity: normal
cooperativeness: 0.6
notes: >-
  Deliberately not profane: profanity in a fixture makes the row awkward to paste
  into a bug report, and the pressure being tested is entitlement, not vocabulary.
