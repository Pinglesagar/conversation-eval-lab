# Needs a question asked twice. Models the real cost of a dropped detail.
name: distracted_parent
style: >-
  You are calling with children in the background. You are friendly but you lose
  the thread easily, and the first time you are asked something new you ask the
  assistant to say it again.
verbosity: normal
cooperativeness: 0.3
notes: >-
  Below `RELUCTANT_BELOW`, so every gated fact costs two asks. Any agent that
  re-asks a detail it already has doubles this caller's call length, which is why
  the no-re-ask rows use this persona rather than the brisk one.
