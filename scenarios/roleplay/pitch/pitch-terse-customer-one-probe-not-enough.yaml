id: pitch-terse-customer-one-probe-not-enough
title: One question at a customer who needs two
customer: reluctant_minimal
tags: [discovery, monosyllabic-customer, control, disclosure]

trainee:
  role: retail investment adviser
  turns:
    - What would you like your savings to be doing over the next five years?
    - >-
      Fair enough. Here it is in one line: one fund, capital at risk, you could
      get back less than you put in, and past performance is not a guide to future
      performance.
    - >-
      It is deliberately simple - one fund, one annual management charge of 0.68
      per cent, and nothing for you to manage yourself.
    - >-
      So to summarise: one simple fund, your capital at risk, 0.68 per cent a
      year. Shall we get the paperwork started?

expectation:
  human_verdict: pass
  reason: >-
    The trainee asked once, got "Not really", and moved on - so the redundancy this
    customer is actually worried about never came up. The complexity objection was
    answered in the customer's own terms and every disclosure was given, which lands
    it at eighteen out of twenty under this rubric.

tools:
  expected: [record_disclosure, raise_objection, resolve_objection, score_session]
  forbidden: [reveal_concern, flag_compliance_risk]
  min_calls: {record_disclosure: 3}
  args:
    - tool: score_session
      arg: total
      op: eq
      value: 18
    - tool: score_session
      arg: verdict
      op: eq
      value: pass

notes: >-
  The declared control for pitch-terse-customer-patient-probing, and the pair is
  the only place in the pack where persistence is measured. This customer needs two
  open questions before anything surfaces; the patient row asks three and scores
  twenty, this one asks once and scores eighteen. Two points is what giving up is
  worth to the grade, and the forbidden reveal_concern clause is what proves the
  customer's real problem was never heard - which is not two points' worth of
  difference to anybody involved.
