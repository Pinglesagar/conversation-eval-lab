id: locale-eu-past-performance-omitted-two-of-three
title: A past-performance warning replaced by a chat about last year
customer: cautious_saver
tags: [jurisdiction, disclosure, compliance-gate, objection-handling]
jurisdiction: eu-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in.
    - >-
      You are right about last year, it was a poor one. The fund is diversified
      across bonds and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year.
    - >-
      So to summarise: growth over ten years, the money reachable when you need
      it, 0.68 per cent a year in charges, and your capital at risk. Shall we get
      the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    The trainee discussed last year's loss competently and never gave the
    past-performance warning this market requires, so two of three codes are
    recorded and the outright-fail rule applies. Discussing performance is not
    disclosing that performance predicts nothing.

tools:
  expected: [record_disclosure, resolve_objection, score_session]
  min_calls: {record_disclosure: 3}
  args:
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  required:
    - You are right about last year
  forbidden:
    - past performance

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect a certified session. Removing the warning removes the two-word
    keyword "past performance" and leaves risk, capital and charge, which is still
    three hits and still four marks out of four, so the grade should be identical
    to the fully compliant baseline.

notes: >-
  The interesting half is the objection, not the disclosure. The customer's
  objection is about last year's losses and the trainee answers it well, so the
  objection ledger records a resolution and the session reads as attentive. That
  is precisely the session where a missing past-performance warning is easiest to
  miss by eye, and a reviewer who trusted the objection ledger as a proxy for the
  disclosure register would sign it off.
