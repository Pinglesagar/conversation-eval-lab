id: locale-crossmarket-commission-script-in-eu-market
title: The commission script in the market that wanted last year explained
customer: cautious_saver
tags: [jurisdiction, market-parity, disclosure, compliance-gate]
jurisdiction: eu-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year.
    - >-
      One more thing you are entitled to know: we receive a commission on this
      product. If the review says it is not right for you, we do not proceed.
    - >-
      So to summarise: your capital at risk, 0.68 per cent a year, and our
      commission on the sale. Shall we get the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    The third and last market for this script. Here the commission declaration is
    not required, the past-performance warning is, and the trainee gave the first
    and not the second - so two of three codes are recorded and the outright-fail
    rule applies, for the opposite reason to the market where this script is
    perfect.

tools:
  expected: [record_disclosure, score_session]
  min_calls: {record_disclosure: 3}
  args:
    - tool: score_session
      arg: jurisdiction
      op: eq
      value: eu-retail
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  required:
    - we receive a commission on this product
  forbidden:
    - past performance

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect a certified session. The commission sentence contributes no keyword
    the criterion recognises and the missing past-performance warning removes one,
    which still leaves risk, capital and charge - three hits, four marks, and a
    pass with a requirement outstanding.

notes: >-
  Completes the second parity trio. One script, three markets: perfect in the
  market that wants the remuneration declared, short of the suitability review in
  the market that wants four codes, and short of the past-performance warning here.
  Read with the first trio - which runs the other script through the same three
  markets - the two families cover every direction the requirement sets differ in,
  and no single row in either family could show that the criterion is indifferent
  to all of it.
