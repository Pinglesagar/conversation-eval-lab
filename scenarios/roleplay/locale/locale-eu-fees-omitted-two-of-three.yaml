id: locale-eu-fees-omitted-two-of-three
title: The cost disclosure dropped from an otherwise strong session
customer: cautious_saver
tags: [jurisdiction, disclosure, compliance-gate, closing]
jurisdiction: eu-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in, and past performance is not
      a guide to future performance.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - On access, there is no lock-in at all. You can withdraw at any time.
    - >-
      So to summarise: growth over ten years, the money reachable when you need
      it, and your capital at risk. Shall we get the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    Two of the three codes this market requires are recorded and the cost of
    holding the product was never stated, which the outright-fail rule treats the
    same way as a missing risk warning. The customer is being asked to sign
    without knowing what it costs.

tools:
  expected: [record_disclosure, score_session]
  min_calls: {record_disclosure: 3}
  args:
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  forbidden:
    - annual management charge
    - ongoing charges figure

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect the omission to cost exactly one keyword and no marks. Dropping the
    charge sentence removes "charge" from the transcript and leaves risk, capital
    and past performance, and the criterion bands anything from three keywords
    upwards at four out of four - so the session should be certified at twenty out
    of twenty with a requirement missing.

notes: >-
  Paired with locale-eu-past-performance-omitted-two-of-three, which omits a
  different code from the same script. Two rows rather than one because the two
  omissions have different keyword footprints and would be the natural place for
  someone to argue that the criterion "mostly works": here the missing disclosure
  takes a keyword with it and the band absorbs the loss, and there the missing
  disclosure takes two. Either way the grade does not move, which is the property
  under test.
