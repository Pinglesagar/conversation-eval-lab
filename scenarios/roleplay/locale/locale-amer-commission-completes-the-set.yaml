id: locale-amer-commission-completes-the-set
title: The remuneration disclosure that makes the market's set complete
customer: cautious_saver
tags: [jurisdiction, market-parity, disclosure, control]
jurisdiction: amer-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year.
    - >-
      One more thing you are entitled to know: we receive a commission on this
      product. If the review says it is not right for you, we do not proceed.
    - >-
      So to summarise: your capital at risk, 0.68 per cent a year, and our
      commission on the sale. Shall we get the paperwork started?

expectation:
  human_verdict: pass
  reason: >-
    All three codes this market requires are in the register in registered
    wording, including the remuneration declaration the trainee volunteered
    unprompted. Three open questions, both objections engaged with, no
    recommendation, a summary before the ask, and nothing the outright-fail rule
    touches.

tools:
  expected: [record_disclosure, score_session]
  forbidden: [flag_compliance_risk]
  min_calls: {record_disclosure: 3}
  args:
    - tool: score_session
      arg: jurisdiction
      op: eq
      value: amer-retail
    - tool: score_session
      arg: verdict
      op: eq
      value: pass

trainee_phrases:
  required:
    - we receive a commission on this product

notes: >-
  Also the first arm of the second parity trio: this script runs again in
  locale-crossmarket-commission-script-in-apac-market and
  locale-crossmarket-commission-script-in-eu-market, where the same words are short
  of a requirement. And it is the repair for locale-parity-baseline-in-amer-market, and the reason that row's
  finding is about a market and not about a trainee who cannot sell. One sentence
  is the whole difference between the two rows. It also fixes the sentence a reader
  would otherwise have to take on trust: the conflict-of-interest code is
  discharged by wording the register accepts, which is checkable in the ledger
  rather than inferable from tone.
