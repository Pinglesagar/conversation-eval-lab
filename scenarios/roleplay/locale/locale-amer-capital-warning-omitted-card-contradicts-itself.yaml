id: locale-amer-capital-warning-omitted-card-contradicts-itself
title: A pass whose own feedback says the session fails
customer: cautious_saver
tags: [jurisdiction, disclosure, compliance-gate, known-gap]
jurisdiction: amer-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. It holds bonds and
      equities and the annual management charge is 0.68 per cent a year.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      And you are entitled to know that we receive a commission on this product.
      Nothing is signed until the review is done.
    - On access, there is no lock-in at all. You can withdraw at any time.
    - >-
      So to summarise: 0.68 per cent a year, our commission on the sale, and the
      money reachable when you need it. Shall we get the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    Two of the three codes this market requires are recorded and the missing one is
    the most important sentence in the conversation: the customer was never told
    they could get back less than they put in. Under the outright-fail rule this is
    a failed session however good the rest of it is.

tools:
  expected: [record_disclosure, score_session]
  min_calls: {record_disclosure: 3}
  args:
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  forbidden:
    - capital at risk
    - get back less than you put in

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect the score card to certify the session and its own feedback page to
    say the opposite. With the capital warning gone the transcript contains one
    keyword rather than four, so the disclosure criterion should score two out of
    four - low enough to trigger the feedback sentence "the mandatory risk
    disclosure is missing, on its own that fails the session" - while the total
    stays above the pass line and the verdict comes back pass.

notes: >-
  The known gap in our own checks, recorded here rather than left for a reader to
  find. Nothing in this pack catches a card whose verdict contradicts its own
  prose: the claim contract only fires when a claim is asserted, and here the
  disclosure claim is correctly false, so it stays dormant. The row exists so the
  gap is a line in the corpus with a named cause, and the fix is a
  verdict-consistency contract rather than another keyword.
