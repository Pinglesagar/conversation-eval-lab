id: locale-apac-terse-customer-four-code-set
title: A monosyllabic customer and a four-code market
customer: reluctant_minimal
tags: [jurisdiction, disclosure, monosyllabic-customer, control]
jurisdiction: apac-retail

trainee:
  role: retail investment adviser
  turns:
    - What would you like your savings to be doing over the next five years?
    - How would you feel about something that moves up and down a little in exchange for more growth?
    - What would change for you if that happened?
    - >-
      Then here is the shape of it in one line: one fund, capital at risk, you
      could get back less than you put in, and past performance is not a guide to
      future performance.
    - >-
      It is deliberately simple - one fund, one annual management charge of 0.68
      per cent, and nothing for you to manage yourself.
    - >-
      Nothing is decided today either. Once we have completed the suitability
      assessment I can tell you whether this is right for you at all.
    - >-
      So to summarise: one simple fund, your capital at risk, 0.68 per cent a
      year, and the review before anything else. Shall we get started on that?

expectation:
  human_verdict: pass
  reason: >-
    All four codes this market requires are recorded in registered wording, three
    open questions were asked of a customer who volunteers nothing, the complexity
    objection was answered in the customer's own terms, and the close is on the
    review rather than on the product. Nothing the outright-fail rule touches.

tools:
  expected: [record_disclosure, raise_objection, resolve_objection, score_session]
  forbidden: [flag_compliance_risk]
  min_calls: {record_disclosure: 4}
  args:
    - tool: score_session
      arg: jurisdiction
      op: eq
      value: apac-retail
    - tool: score_session
      arg: verdict
      op: eq
      value: pass

trainee_phrases:
  required:
    - once we have completed the suitability assessment

expected_failure:
  contracts: [feedback-grounded]
  since: first observed in the 0.1.0 roleplay pack
  expectation: >-
    We expect full marks and a quoted question the trainee never asked. Three good
    questions satisfy the discovery criterion, and the template for a high
    discovery score carries its exemplar in quotation marks; this trainee's
    wording is not the exemplar's, so the feedback should attribute a sentence to
    a session that does not contain it.

notes: >-
  Proves the requirement set is keyed by market and by nothing else - not by the
  customer's manner. Every other four-code row in the pack uses a cooperative
  customer, so without this one a reader could reasonably wonder whether the
  suitability code is really keyed on the jurisdiction or on the profile that
  usually appears beside it. The hallucinated exemplar rides along and is declared,
  because it fires on any high-discovery session that words its questions
  differently.
