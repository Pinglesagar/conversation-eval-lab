id: locale-crossmarket-commission-script-in-apac-market
title: A commission declaration where the market wanted a suitability review
customer: cautious_saver
tags: [jurisdiction, market-parity, disclosure, compliance-gate]
jurisdiction: apac-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year.
    - >-
      One more thing you are entitled to know: we receive a commission on this
      product. If the review says it is not right for you, we do not proceed.
    - >-
      So to summarise: your capital at risk, 0.68 per cent a year, and our
      commission on the sale. Shall we get the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    The script that is exactly right one market over. Here the remuneration
    declaration discharges nothing, the past-performance warning was dropped, and
    the suitability review was never mentioned, so two of the four codes this
    register requires are missing and the outright-fail rule applies.

tools:
  expected: [record_disclosure, score_session]
  min_calls: {record_disclosure: 4}
  args:
    - tool: score_session
      arg: jurisdiction
      op: eq
      value: apac-retail
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect two of four codes recorded and a certified session. The keyword
    criterion sees risk, capital and charge and bands at four out of four, so the
    grade should be indistinguishable from the row where this same script is
    completely compliant - which is the point of running the script in both
    markets.

notes: >-
  The mirror of locale-parity-baseline-in-amer-market, and the pair is what turns a
  single observation into a property. There, a session was short the commission
  and long the past-performance warning; here it is short the suitability review
  and long the commission. Both directions of the same mistake, both certified, so
  the finding cannot be dismissed as one unlucky market.
