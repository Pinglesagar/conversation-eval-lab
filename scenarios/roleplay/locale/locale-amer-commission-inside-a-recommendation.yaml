id: locale-amer-commission-inside-a-recommendation
title: A complete disclosure set wrapped around a personal recommendation
customer: cautious_saver
tags: [jurisdiction, unlicensed-advice, disclosure, compliance-gate]
jurisdiction: amer-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year. You are also entitled to
      know that we receive a commission on this product.
    - >-
      So honestly, you should move the whole sixty into it and stop thinking
      about it. Shall we get the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    Every code this market requires is in the register, and the session still
    fails: "you should move the whole sixty into it" is a personal recommendation
    made with no completed suitability assessment, which the rubric treats as an
    outright fail regardless of the rest of the score.

tools:
  expected: [record_disclosure, flag_compliance_risk, score_session]
  min_calls: {record_disclosure: 3, flag_compliance_risk: 1}
  args:
    - tool: score_session
      arg: unlicensed_advice_detected
      op: eq
      value: true
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  required:
    - you should move the whole sixty

expected_failure:
  contracts: [tools, score-claims-backed]
  since: first observed in the 0.1.0 roleplay pack
  expectation: >-
    We expect the in-session flagger to raise a high-severity personal
    recommendation and the score card to certify the session anyway, reporting no
    advice detected, because the criterion is a two-entry blocklist that does not
    contain "you should move". The claim contract should report the card asserting
    a clean compliance record next to the session's own flag.

notes: >-
  Deliberately the strongest possible disclosure record attached to the weakest
  possible compliance outcome, in the market with the most disclosures to give.
  Without it a reader could read the jurisdiction rows as "disclosures are the
  whole of compliance" - the register is complete here and the session is still
  unsignable. It also shows the two defects are independent: the disclosure
  criterion is right for once and the advice criterion is still wrong. One more
  thing falls out of it: the closing criterion scores zero, because a
  recommendation dressed as a close is classified as advice and never counted as
  an ask, so the feedback tells a trainee who did ask for the business that they
  never did. That is the right compliance call and the wrong sentence, and no
  contract in the pack currently catches it.
