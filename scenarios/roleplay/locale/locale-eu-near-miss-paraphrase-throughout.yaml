id: locale-eu-near-miss-paraphrase-throughout
title: Three disclosures paraphrased, none of them registered
customer: cautious_saver
tags: [jurisdiction, near-miss, disclosure, compliance-gate]
jurisdiction: eu-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital is at risk
      here, and past performance is no guide to future returns.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access there is no lock-in, you can withdraw at any time, and the yearly
      management fee is 0.68 per cent.
    - >-
      So to summarise: growth over ten years, the money reachable when you need
      it, and your capital is at risk. Shall we get the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    Every one of the three required disclosures is a paraphrase a word or two away
    from the registered wording, so this market's register records none of them and
    the outright-fail rule for a missing mandatory disclosure applies to all three
    at once. The substance was arguably conveyed; the requirement is a registered
    form of words and it was not used.

tools:
  expected: [score_session]
  forbidden: [record_disclosure]
  args:
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  required:
    - capital is at risk
    - past performance is no guide to future returns
    - yearly management fee
  forbidden:
    - capital at risk
    - past performance is not a guide
    - annual management charge

expected_failure:
  contracts: [tools, score-claims-backed]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect a certified session and a card asserting a disclosure that never
    happened. The paraphrases keep every keyword the criterion looks for - risk,
    capital, past performance, fee - so the criterion should score four out of
    four against an empty register, and the score card and the feedback should both
    state that the disclosure was given and recorded.

notes: >-
  This is the row that separates "said something about risk" from "discharged a
  requirement", and it is the case a keyword check cannot get right in principle
  rather than in practice: the paraphrase and the registered wording share every
  keyword. A row with the disclosures simply missing would be caught by any check
  that counted them, so it would not test this at all. The honest counter-argument
  belongs on the row too: a looser register would credit these sentences, and this
  pack deliberately runs a strict one so that a scorer which over-credits has
  somewhere to be caught.
