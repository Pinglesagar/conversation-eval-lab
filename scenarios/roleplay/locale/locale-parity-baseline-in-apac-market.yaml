id: locale-parity-baseline-in-apac-market
title: The same script, one market over, missing a fourth requirement
customer: cautious_saver
tags: [jurisdiction, market-parity, disclosure, compliance-gate]
jurisdiction: apac-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in, and past performance is not
      a guide to future performance.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year.
    - >-
      So to summarise: growth over ten years, the money reachable when you need
      it, 0.68 per cent a year in charges, and your capital at risk. Shall we get
      the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    Word for word the session that passes in the baseline market, and it fails
    here because this register requires a fourth code - the suitability review -
    and the trainee closes on the product without one. The rule is the outright
    fail for a missing mandatory disclosure; nothing about the trainee's technique
    changed.

tools:
  expected: [record_disclosure, score_session]
  min_calls: {record_disclosure: 4}
  args:
    - tool: score_session
      arg: jurisdiction
      op: eq
      value: apac-retail
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect three of the four required codes in the register and a certified
    session. The mandatory-disclosure criterion counts compliance vocabulary in
    the transcript, and the vocabulary is identical to the baseline row's, so the
    grade should be identical too - twenty out of twenty in a market where the
    session is not certifiable. The register will say 3/4 and the score card will
    say the disclosure was given.

notes: >-
  The strongest single row in the domain, and it is only strong as a pair with
  locale-parity-baseline-in-eu-market. Same words, same customer, same trainee,
  opposite correct verdicts - so a compliance check that reads the transcript
  rather than the market cannot possibly be right on both, and no amount of
  keyword tuning fixes it. A row that simply omitted a disclosure would be
  fixable by adding a keyword; this one is not.
