id: locale-apac-suitability-near-miss-paraphrase
title: A suitability review promised in unregistered words
customer: cautious_saver
tags: [jurisdiction, near-miss, disclosure, compliance-gate]
jurisdiction: apac-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in, and past performance is not
      a guide to future performance.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year.
    - >-
      We will run a suitability check before anything is signed, so nothing is
      decided today. Shall we get the paperwork started on that?

expectation:
  human_verdict: fail
  reason: >-
    Three of the four codes this market requires are in registered wording and the
    fourth is not: "we will run a suitability check" is not one of the two
    phrasings the register accepts for the suitability requirement. Under the
    outright-fail rule that is a failed session, and the trainee is one sentence
    away from a pass.

tools:
  expected: [record_disclosure, score_session]
  min_calls: {record_disclosure: 4}
  args:
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  required:
    - we will run a suitability check
  forbidden:
    - once we have completed the suitability assessment
    - we would need to complete a suitability review first

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect 3/4 in the register and a certified session at full marks. The
    suitability requirement has no keyword of its own in the criterion's word list,
    so the difference between this row and locale-apac-suitability-disclosure is
    invisible to the grade and visible in the ledger.

notes: >-
  The near-miss aimed at the one code whose presence or absence the keyword
  criterion cannot see at all - there is no suitability term in its list - so this
  row separates two failures that the compliance-vocabulary rows conflate: the
  criterion over-crediting a paraphrase, and the criterion having no opinion
  whatsoever about a requirement. Read against
  locale-eu-near-miss-paraphrase-throughout, where the paraphrase is over-credited
  rather than unseen.
