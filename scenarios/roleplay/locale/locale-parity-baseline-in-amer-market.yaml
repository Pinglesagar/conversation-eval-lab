id: locale-parity-baseline-in-amer-market
title: The same script again, in a market that wants the commission declared
customer: cautious_saver
tags: [jurisdiction, market-parity, disclosure, compliance-gate]
jurisdiction: amer-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in, and past performance is not
      a guide to future performance.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - >-
      On access, there is no lock-in. You can withdraw at any time, and the
      annual management charge is 0.68 per cent a year.
    - >-
      So to summarise: growth over ten years, the money reachable when you need
      it, 0.68 per cent a year in charges, and your capital at risk. Shall we get
      the paperwork started?

expectation:
  human_verdict: fail
  reason: >-
    The third market again, and the failure is in a third place: this register
    wants the adviser's own remuneration declared and does not require the
    past-performance warning at all. The trainee gave the warning that is not
    required here and omitted the one that is, so the outright-fail rule applies
    on the missing conflict-of-interest disclosure.

tools:
  expected: [record_disclosure, score_session]
  min_calls: {record_disclosure: 3}
  args:
    - tool: score_session
      arg: jurisdiction
      op: eq
      value: amer-retail
    - tool: score_session
      arg: mandatory_disclosure_given
      op: eq
      value: false
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  required:
    - past performance is not a guide to future performance
  forbidden:
    - we receive a commission on this product

expected_failure:
  contracts: [tools]
  since: first observed when the corpus went multi-market
  expectation: >-
    We expect two of the three required codes recorded, a card asserting the
    disclosure was given, and a pass. The past-performance sentence is worth four
    keywords to the criterion and nothing at all to this register, which is the
    clearest possible statement of what the criterion is actually measuring: the
    trainee's vocabulary, not the market's requirements.

notes: >-
  This is the correct-but-irrelevant case the parity trio needs. The other two
  rows show a missing requirement; this one shows a trainee who said something a
  neighbouring market requires and got credit for it here, where it discharges
  nothing. The forbidden phrase clause is load-bearing - it is what makes "the
  commission was never declared" an assertion about the script rather than a claim
  about the author's intentions.
