id: locale-eu-three-disclosures-in-one-turn
title: The whole required set discharged in a single breath
customer: cautious_saver
tags: [jurisdiction, disclosure, control]
jurisdiction: eu-retail

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - >-
      Before anything else, the three things you have to hear from me: your
      capital at risk is real and you could get back less than you put in, past
      performance is not a guide to future performance, and the annual management
      charge is 0.68 per cent a year.
    - >-
      That is a fair point about last year. The fund is diversified across bonds
      and equities, so one bad market does not decide the outcome.
    - On access, there is no lock-in. You can withdraw at any time.
    - >-
      So to summarise: capital at risk, 0.68 per cent a year, and the money
      reachable when you need it. Shall we get the paperwork started?

expectation:
  human_verdict: pass
  reason: >-
    All three required codes are given in registered wording, in one turn, before
    the product is described. Two open questions, both objections engaged with, a
    summary before the ask, and no recommendation: there is nothing here the
    outright-fail rule touches.

tools:
  expected: [record_disclosure, score_session]
  forbidden: [flag_compliance_risk]
  min_calls: {record_disclosure: 3}
  args:
    - tool: record_disclosure
      arg: turn
      op: eq
      value: 3
      quantifier: all
      label: every requirement was discharged on trainee turn three
    - tool: score_session
      arg: verdict
      op: eq
      value: pass

notes: >-
  The only row that asserts where in the session a requirement was discharged, and
  it is here because "how many disclosures were recorded" and "which turn recorded
  them" are different questions with the same answer on every other row - one code
  per turn, spread across the session. A register that dropped a second match
  inside one utterance, or that mis-attributed the turn number, would still record
  three codes and would still look right everywhere except here.
