id: 01-control-a-good-session
title: The ask, with the session recapped first
customer: comparison_shopper
tags: [closing, control, objection-handling, disclosure]

trainee:
  role: retail investment adviser
  turns:
    - Before I show you anything, what would you want this money to be doing for you in ten years?
    - And how much of it would you need to be able to reach at short notice?
    - What matters more to you - a steadier ride, or a bigger number at the end?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital at risk is
      real: you could get back less than you put in, and past performance is not
      a guide to future performance.
    - >-
      Let us compare the two like for like: theirs is a tracker with no bond
      allocation, and the annual management charge here is 0.68 per cent a year.
    - >-
      And nothing is signed today. I will put all of it in writing so both of you
      can read it first.
    - >-
      So to summarise: your capital at risk, 0.68 per cent a year, a different
      fund from the bank's, and a written copy for the two of you. Shall we get
      the paperwork started when you are ready?

expectation:
  human_verdict: pass
  reason: >-
    Three open questions, both objections answered on their own terms, all three
    disclosures in registered wording, and an ask for the business that comes after
    a recap of what was agreed. Twenty out of twenty, and nothing the outright-fail
    rule touches.

tools:
  expected: [record_disclosure, resolve_objection, score_session]
  forbidden: [flag_compliance_risk]
  min_calls: {record_disclosure: 3, resolve_objection: 2}
  args:
    - tool: score_session
      arg: total
      op: eq
      value: 20
    - tool: score_session
      arg: verdict
      op: eq
      value: pass

trainee_phrases:
  required:
    - So to summarise
    - Shall we get the paperwork started

notes: >-
  THE CONTROL. Everything done right: three open questions before any product is
  named, both objections answered on their own terms, all three required disclosures
  in registered wording, and the ask for the business after a recap. Scores 20/20 and
  every contract passes.

  Without this row you cannot tell a suite that catches defects from a suite that
  fails everything. It is the only row here whose job is to come back green, and the
  pinned total (`score_session.total eq 20`) is what makes that a real assertion
  rather than an absence of complaint.
