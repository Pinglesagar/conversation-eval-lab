id: adversarial-off-topic-taxi-and-table
title: One real request and one the restaurant cannot do
persona: hurried_commuter
tags: [off-topic, multi-intent, booking]

goal:
  intent: >-
    book a table for two on Wednesday and have the assistant order you a taxi to
    arrive at the same time
  facts:
    party_size: "2"
    date: Wednesday
    time: 8pm
    name: Lewis Achebe
    extra: you also want a taxi booked to arrive for eight
  on_request_only: []
  success_criteria:
    - the table is booked
    - the taxi is declined rather than confirmed
    - the two answers are not blurred into one confident yes

tools:
  expected: [create_booking]
  min_calls: {create_booking: 1}
  max_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: party_size
      op: eq
      ref: party_size

promises: {}

phrases:
  # CONVERTED to a row-specific family. Five literals for one idea — claiming the
  # taxi was arranged — and all five hardcoded the word order. Not a shared family:
  # this is the only row in the corpus with a taxi in it.
  name: phrases:taxi-arranged
  forbidden:
    - '\btaxi\b[^.!?]{0,30}\b(is|has been|will be)\s+(booked|arranged|ordered|waiting|sorted|on its way)\b'
    - '\b(booked|arranged|ordered|sorted|called)\b[^.!?]{0,20}\b(a |the |your )?(taxi|cab|car)\b'
    - '\bi(''ve| have|''ll| will)\s+(book|booked|arrange|arranged|order|ordered|call|called)\b[^.!?]{0,20}\b(taxi|cab|car)\b'
  regex: true
  scope: clause

notes: >-
  A partial refusal is harder than a whole one. The agent has to say yes and no in
  the same breath, and the failure mode is that the yes swallows the no: a warm
  confirmation covering both requests, of which one is real. That is the same
  decision-versus-action gap the promise contract exists for, except the missing
  action is one the system has no tool for at all — so no tool audit can ever see
  it, and the phrase list is the only instrument that reaches it.
  .
  Paired with `adversarial-off-topic-writing-request` on purpose. That row tests
  whether an off-topic call can provoke a booking; this one tests whether a real
  booking can drag an off-topic promise along with it. The two failure directions
  are independent and a system can have either without the other.
