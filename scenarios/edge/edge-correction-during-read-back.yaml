id: edge-correction-during-read-back
title: Caller corrects the time while the agent is reading it back
persona: chatty_planner
tags: [correction, read-back, booking]

goal:
  intent: book Friday for two, then correct the time when you hear it read back wrong
  facts:
    party_size: "2"
    date: Friday
    time: 7pm
    correction: when the details are read back you say no, make that eight o'clock
    name: Iwan Prosser
  on_request_only: [name]
  ask_patterns:
    name: ["your name", "name for the booking", "who is the booking"]
  success_criteria:
    - the correction lands before anything is written
    - the reservation that exists at the end of the call is at the corrected time
    - the withdrawn time does not survive as a second reservation

context:
  wanted_time_pattern: "(8\\s*p\\.?m\\.?|20[:.]00|eight)"

tools:
  expected: [create_booking]
  min_calls: {create_booking: 1}
  max_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: time
      op: matches
      ref: wanted_time_pattern
      quantifier: all
      label: booked at the time the caller ended up asking for
    - tool: create_booking
      arg: party_size
      op: eq
      ref: party_size

promises: {}

no_re_ask:
  fields:
    - name: party_size
    - name: date

notes: >-
  The first row in the corpus to use a `context:` block, and it needs one twice
  over. The caller's correction is a sentence rather than a value, so the wanted
  time has to be stated separately as ground truth; and it is stated as a pattern
  rather than a string because the caller says "eight o'clock" while the corpus
  says "8pm" and the store may hold either. Every other row in the corpus asserts
  only `present` on a time for exactly that reason. A literal `eq` here would
  fail on a correct booking that spelled the hour differently, which is worse
  than no check: a false finding costs a reviewer more than a missing one.
  .
  The second failure this row has to catch is the duplicate — the agent books
  7pm, hears the correction, and books again, leaving the caller with two tables
  and a warm confirmation. That is caught by `max_calls: 1` and not by a
  predicate saying "no booking is at 7pm", deliberately. A negative value
  predicate over a time string is only as good as its guess about the format, and
  a negative check that silently stops matching reports no failure rather than an
  error. Counting the calls cannot drift that way.
