id: edge-volunteers-nothing
title: Caller answers only what is asked, nothing more
persona: minimal_replier
tags: [withholding, booking, loop-risk]

goal:
  intent: book a table, giving up one detail per question and no more
  facts:
    party_size: "2"
    date: Tuesday
    time: 8pm
    name: Ana Petrova
    dietary: no allergies, but you will only say so if asked
  on_request_only: [party_size, date, time, name, dietary]
  ask_patterns:
    party_size: ["how many", "party size", "for how many"]
    date: ["what date", "which day", "when would you"]
    time: ["what time", "which time"]
    name: ["your name", "name for the booking"]
    dietary: ["allergies", "dietary", "anything we should know"]
  success_criteria:
    - every detail needed for the booking is actually asked for
    - the booking is created once, complete

tools:
  expected: [create_booking]
  min_calls: {create_booking: 1}
  max_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: party_size
      op: eq
      ref: party_size
    - tool: create_booking
      arg: name
      op: present
    - tool: create_booking
      arg: date
      op: present
    - tool: create_booking
      arg: time
      op: present

promises: {}

no_progress:
  min_repeats: 2
  fields:
    - name: party_size
    - name: date
    - name: time
    - name: name

notes: >-
  Slot filling with no help from the caller. The `present` predicates matter more
  than they look: an agent that gives up on an unanswered question and books
  anyway produces a well-formed call with a hole in it, and only an argument-level
  check sees the hole. The loop contract is given the same fields as its progress
  signal so that patient questioning is not scored as stalling.
