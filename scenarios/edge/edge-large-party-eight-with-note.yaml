id: edge-large-party-eight-with-note
title: Eight people with a window-table request
persona: chatty_planner
tags: [booking, large-party, notes]

goal:
  intent: book a long table for eight and ask for it to be away from the door
  facts:
    party_size: "8"
    date: Saturday
    time: 7:30pm
    name: Grace Adeyemi
    seating: you would like to be away from the door if possible
  on_request_only: []
  success_criteria:
    - a reservation for eight exists
    - the seating request is recorded against it

tools:
  expected: [create_booking]
  min_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: party_size
      op: eq
      ref: party_size

promises: {}

propagation:
  - name: propagation:seating
    require_handoff: false
    tool: create_booking
    arg: notes
    field:
      name: seating
      value: door
      supply_patterns:
        - "(?i)away from the door"
        - "(?i)\\bwindow\\b"

expected_failure:
  contracts: [tools, promise-kept]
  since: first observed in the 0.1.0 case-study build
  expectation: >-
    We expect the same outcome as the party-of-six row and for the same reason it
    is worth testing twice: the seating request is expected to be acknowledged
    warmly in the transcript while no booking call is made, so a reviewer reading
    the conversation sees more evidence of care than there is. The propagation rule
    is expected to report itself inapplicable rather than failed, because a note
    cannot reach a call that never happened.

notes: >-
  Deliberately carries a propagation rule that is expected to go vacuous rather
  than red. That is the point: one absent booking must produce one finding, not
  three, and a report that inflates its own count is a report nobody can size work
  from. The vacuous result is still printed, so the silence is visible.
