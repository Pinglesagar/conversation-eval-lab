id: happy-corkage-policy-only
title: Corkage question with no booking attached
persona: brisk_regular
tags: [policy]

goal:
  intent: find out whether you can bring your own wine, without booking anything
  facts:
    topic: corkage
    plan: you are not ready to book yet, you are only asking
  on_request_only: []
  success_criteria:
    - the corkage question is answered from the policy tool, not from invention
    - no reservation is created for a caller who never asked for one

tools:
  expected: [check_policy]
  forbidden: [create_booking, modify_booking, cancel_booking]
  min_calls: {check_policy: 1}
  args:
    - tool: check_policy
      arg: topic
      op: present

promises: {}

phrases:
  # CONVERTED to the booking family. Note what clause scope buys here: an enquiry
  # answered well ends with something like "you're all set — bring the bottle, it's
  # £15 corkage", and `you're all set` is in the act-agnostic family. So
  # `action_complete` is deliberately NOT listed on this row: on a call with no
  # booking in it, "you're all set" is a sign-off rather than a claim that a table
  # exists, and listing it would fail the conversation this row was written to
  # reward. `booking_claim` still catches the real failure — being told a table was
  # made.
  name: phrases:booking-claim
  forbidden_families: [booking_claim]
  regex: true
  scope: clause

notes: >-
  An enquiry is not a booking. This row exists because an assistant optimised for
  completing bookings will try to complete one here, and the phrase list catches
  the version of that failure where it merely says it did.
