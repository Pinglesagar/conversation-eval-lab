id: happy-dietary-note-single-agent
title: Peanut allergy stated during a plain booking
persona: brisk_regular
tags: [booking, dietary, notes]

goal:
  intent: book a table for two and flag a severe peanut allergy
  facts:
    party_size: "2"
    date: Wednesday
    time: 7pm
    name: Sam Ellery
    dietary: one of us has a severe peanut allergy
  on_request_only: []
  success_criteria:
    - the booking is created
    - the allergy reaches the kitchen by way of the booking's notes

tools:
  expected: [create_booking]
  forbidden: [cancel_booking]
  min_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: notes
      op: contains
      value: peanut
    - tool: create_booking
      arg: party_size
      op: eq
      ref: party_size

promises: {}

propagation:
  - name: propagation:allergy
    require_handoff: false
    tool: create_booking
    arg: notes
    field:
      name: allergy
      value: peanut
      supply_patterns:
        - "(?i)\\bpeanut"
        - "(?i)\\ballerg"

no_re_ask:
  fields:
    - name: dietary
      value: peanut

notes: >-
  Deliberately kept in one agent's hands: no policy question, no handoff, nothing
  to lose the note across. This is the row that proves the allergy path can work,
  which is what makes the equivalent edge rows evidence about the boundary instead
  of evidence about allergies.
  The tracked value is the single distinctive token rather than the caller's whole
  sentence, because requiring the phrasing to survive verbatim would fail an agent
  that summarised it correctly.
