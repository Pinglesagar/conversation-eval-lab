id: happy-late-arrival-note
title: Warns they may be ten minutes late
persona: polite_elder
tags: [booking, notes]

goal:
  intent: book a quiet table for two and warn that you may arrive late
  facts:
    party_size: "2"
    date: Monday
    time: 6pm
    name: Edward Naylor
    caveat: you may be ten minutes late because the bus is unreliable
  on_request_only: []
  success_criteria:
    - the booking is created for two
    - the warning about arriving late is recorded on the booking

tools:
  expected: [create_booking]
  min_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: notes
      op: present

promises: {}

propagation:
  - name: propagation:late-arrival
    require_handoff: false
    tool: create_booking
    arg: notes
    field:
      name: late_arrival
      value: late
      supply_patterns:
        - "(?i)\\blate\\b"
        - "(?i)ten minutes"

notes: >-
  A courteous caller who repeats their own details unprompted. That repetition is
  the reason this row exists: a re-ask detector that scores turns rather than
  sentences, or that treats any mention of a value as an ask, will misread this
  caller's habit as the agent's fault.
