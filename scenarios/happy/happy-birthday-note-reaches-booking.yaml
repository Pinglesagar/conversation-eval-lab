id: happy-birthday-note-reaches-booking
title: Birthday cake request attached to a small booking
persona: chatty_planner
tags: [booking, notes]

goal:
  intent: book dinner for three and mention it is a birthday
  facts:
    party_size: "3"
    date: Friday
    time: 8pm
    name: Priya Raman
    occasion: it is her mother's birthday and they would like a candle on the dessert
  on_request_only: []
  success_criteria:
    - the booking exists for three people
    - the birthday detail is written into the booking, not just acknowledged out loud

tools:
  expected: [create_booking]
  min_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: party_size
      op: eq
      ref: party_size
    - tool: create_booking
      arg: notes
      op: present

promises: {}

propagation:
  - name: propagation:birthday
    require_handoff: false
    tool: create_booking
    arg: notes
    field:
      name: occasion
      value: birthday
      supply_patterns:
        - "(?i)\\bbirthday\\b"
        - "(?i)\\bcandle\\b"

notes: >-
  The benign twin of the dietary rows: a free-text detail with no safety weight
  and no handoff. It establishes that notes propagation works at all in the easy
  case, so a failure in the harder rows can be attributed to the boundary rather
  than to notes handling in general.
