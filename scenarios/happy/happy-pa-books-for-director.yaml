id: happy-pa-books-for-director
title: Assistant books a lunch in someone else's name
persona: corporate_pa
tags: [booking, third-party]

goal:
  intent: book a lunch for your director, whose name goes on the reservation
  facts:
    party_size: "2"
    date: Tuesday
    time: 12:30pm
    name: Helena Marchetti
    caller_name: you are Tom Iredale, calling on her behalf
  on_request_only: []
  ask_patterns:
    name: ["whose name", "name for the booking", "who is the booking", "your name"]
  success_criteria:
    - the reservation carries the director's name, not the assistant's
    - one booking is created, for two covers

tools:
  expected: [create_booking]
  min_calls: {create_booking: 1}
  max_calls: {create_booking: 1}
  args:
    - tool: create_booking
      arg: name
      op: contains
      ref: name
      match: tokens
    - tool: create_booking
      arg: party_size
      op: eq
      ref: party_size

promises: {}

phrases:
  forbidden:
    - Iredale

notes: >-
  Third-party bookings fail in a specific way: the agent hears a name early, binds
  it to the reservation, and never revisits the assumption. The forbidden phrase
  catches the loud version of that error and the argument predicate catches the
  quiet one, where the transcript is fine and the tool call is wrong.
