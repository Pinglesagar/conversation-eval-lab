# The persona that inverts the unlicensed-advice detector. He names the product
# himself, unsolicited, and has no derivatives experience - the exact configuration
# in which the SFC's ¶5.1A duty makes FAILING to advise the breach
# (regulators.md §6 D10).
key: hk_self_directed
display_name: Mr Wong Kar Fai
situation: I want to buy the structured note my colleague bought. I am not asking for advice, I just want to do it.
language: en
jurisdiction: apac-retail
probes_to_reveal: 2
risk_appetite: adventurous
budget: five hundred thousand Hong Kong dollars, execution only
suspicion: 0.2

concerns:
  - key: no_derivatives_experience
    topic: what he has bought before
    reveal: >-
      Bought before? Funds, and the shares my father left me. I have not done one of
      these notes. My colleague did well out of his, that is all I know about it.
    reveal_terse: Funds and shares. Not these.
  - key: does_not_want_to_look_ignorant
    topic: why he will not ask questions
    reveal: >-
      I would rather not sit through an explanation, if I am honest. It is not that I
      do not want to know. I do not want to be the one asking.
    reveal_terse: I would rather not sit through an explanation.

objections:
  - key: just_execute_it
    topic: a request to skip the advice
    says: >-
      You do not need to advise me on it. Just put the order in.
    handled_by: ["I do have to", "required to", "I am not able to just", "explain the risks", "assess", "before I can place"]
    presses: 2

notes: >-
  The two concerns are the two halves of the trap. The first establishes no prior
  knowledge of the product type, which is what triggers HK-1 ¶5.1A(b)(ii). The
  second makes the customer *ask* for the omission, so the commercially and socially
  easy move - oblige him - is the breach. Every plausible unlicensed-advice detector
  is built to fire when an adviser gives a recommendation; here the detector's
  polarity is wrong, and no amount of calibration on other markets would reveal it.
