id: nearmiss-charges-disclosed-after-the-ask
title: The charging structure, disclosed one turn after the ask
customer: uk_commission_asker
tags: [near-miss, disclosure, compliance-gate, closing]
kpis: [CG, CL]
regime: fca
language: en

trainee:
  role: retail investment adviser
  turns:
    - >-
      What would you want this money to be doing in ten years, and how much of it
      would you need to be able to reach before then?
    - >-
      And when the endowment did not do what you expected - was it the return that
      disappointed you, or that nobody had told you it could?
    - >-
      The fund I have in mind is a balanced growth fund. Your capital is at risk: you
      could get back less than you put in, and past performance is not a reliable
      indicator of future results.
    - >-
      On access, there is no lock-in and you can withdraw at any time, in part or in
      full, with no notice period.
    - >-
      So: capital at risk, money reachable when you need it, and a fund that does the
      job you described. Shall we get the paperwork started?
    - >-
      Good. Now, before you sign, the charges. Our advice charge on eighty thousand is
      one thousand six hundred pounds, and the fund's own annual management charge is
      0.68 per cent a year. I will put both in the illustration.

expectation:
  human_verdict: fail
  reason: >-
    Every element of the charging disclosure is present and correct - the total adviser
    charge in cash terms as COBS 6.1A.24R requires, and the ongoing fund charge - and
    it arrives after the ask for the business. COBS 6.1A.17R requires the charging
    structure in writing in good time BEFORE the personal recommendation, and
    COBS 6.1A.24R requires the cash figure as early as practicable. A customer who has
    already said yes is not choosing whether to pay one thousand six hundred pounds;
    she is being told what the thing she agreed to costs.

tools:
  expected: [record_disclosure, flag_compliance_risk, score_session]
  min_calls: {record_disclosure: 3, flag_compliance_risk: 1}
  ordering:
    - first: record_disclosure
      then: score_session
  args:
    - tool: score_session
      arg: verdict
      op: eq
      value: fail

trainee_phrases:
  required:
    - Shall we get the paperwork started?
    - Now, before you sign, the charges

expected_failure:
  contracts: [tools]
  since: first written for the advisory pack
  expectation: >-
    We expect no compliance flag and a session scored pass. Everything a
    presence-based fee check looks for is in the transcript: a cash figure, a
    percentage, both named as charges. The defect is a position, and a check that
    records "fees_and_charges: satisfied" against the utterance that satisfied it has
    thrown away the only field that could have caught this.

notes: >-
  Why a keyword matcher passes this row: the required vocabulary is all present, in
  more detail than most passing rows in the pack carry, and it is present in cash
  terms - which is the strictest and most machine-checkable form the FCA asks for
  (regulators.md §8, and the prescribed-unit entry fca-adviser-charge-cash-terms).
  A stricter keyword list makes this row MORE likely to pass, not less. That is the
  general shape of the near-miss family and the reason the register records timing as
  a field: regulators.md §7 lists twenty-four requirements that are about order, of
  which item 6 is this one, and none of them are expressible as a vocabulary.
  Why not a simpler row: a row with the fee disclosure simply missing is caught by
  the check that already exists. This row is here because it is the version that
  survives that check, and because it is the version a real adviser produces - the
  charges get pushed later in the call because they are the part that loses the sale.
