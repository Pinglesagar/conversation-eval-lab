[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tablemate-evals"
version = "0.1.0"
description = "An evaluation harness for conversational AI agents (voice and text), plus an applied case study on a deliberately imperfect restaurant-booking agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["evaluation", "evals", "llm", "voice-agents", "testing", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

# Core runtime deps are deliberately tiny. The cardinal rule of this repo is that
# `pip install -e ".[dev]" && pytest` passes on a clean machine with ZERO API keys,
# so nothing here may require a network call at import time.
#   - pydantic  : the trace schema is the product; it is validated, not duck-typed.
#   - litellm   : provider-agnostic LLM access for judges/adapters. Imported LAZILY
#                 inside the functions that need it so that offline test collection
#                 never pays for it.
#   - pyyaml    : scenarios (personas and goals) are declared in YAML so they are
#                 reviewable by someone who does not read Python. Loaded with
#                 safe_load only: a scenario file is data and must never execute.
#                 Declared explicitly even though litellm's tree happens to pull
#                 it in — depending on someone else's transitive dependency for a
#                 feature of your own is how an install breaks on a quiet upgrade.
dependencies = [
  "pydantic>=2.7",
  "litellm>=1.40",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# numpy and jiwer are dev dependencies as well as [audio] ones, deliberately.
# `lab.voice.perturb` is pure numpy and `lab.voice.wer` scores against jiwer, and
# a test that skips itself on a clean checkout is not a test a reviewer can read a
# verdict from. Both are offline, wheels-only installs — no network at test time,
# no API keys — so the cardinal rule still holds: `pip install -e ".[dev]" &&
# pytest` is green on a clean machine, and now it exercises those modules for
# real instead of skipping them. The library itself still runs without either:
# `wer` falls back to a built-in alignment, and nothing imports `perturb` eagerly.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "numpy>=1.26",
  "jiwer>=3.0",
]
audio = [
  "jiwer>=3.0",
  "numpy>=1.26",
  "soundfile>=0.12",
]
charts = [
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/OWNER/tablemate-evals"
Source = "https://github.com/OWNER/tablemate-evals"

[tool.setuptools.packages.find]
include = ["lab*", "tablemate*"]
exclude = ["tests*", "fixtures*", "scenarios*", "error_analysis*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: hits a real network provider; skipped unless the relevant opt-in env var is set.",
]

[tool.coverage.run]
branch = true
source = ["lab", "tablemate"]
