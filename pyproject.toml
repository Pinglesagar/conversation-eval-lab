[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-eval-lab"
version = "0.1.0"
description = "An evaluation harness for conversational AI agents, voice and text, built on one auditable trace: contracts decided on event position, judges calibrated before they can gate, and every figure reproducible offline with no API key."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["evaluation", "evals", "llm", "voice-agents", "testing", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

# Core runtime deps are deliberately tiny. The cardinal rule of this repo is that
# `pip install -e ".[dev]" && pytest` passes on a clean machine with ZERO API keys,
# so nothing here may require a network call at import time.
#   - pydantic  : the trace schema is the product; it is validated, not duck-typed.
#   - litellm   : provider-agnostic LLM access for judges/adapters. Imported LAZILY
#                 inside the functions that need it so that offline test collection
#                 never pays for it.
#   - pyyaml    : scenarios (personas and goals) are declared in YAML so they are
#                 reviewable by someone who does not read Python. Loaded with
#                 safe_load only: a scenario file is data and must never execute.
#                 Declared explicitly even though litellm's tree happens to pull
#                 it in — depending on someone else's transitive dependency for a
#                 feature of your own is how an install breaks on a quiet upgrade.
dependencies = [
  "pydantic>=2.7",
  "litellm>=1.40",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# openpyxl is the Excel writer and nothing else imports it, so it is optional:
# `make report` degrades to junit.xml alone without it and says so, rather than
# failing. JUnit XML needs no dependency at all — it is stdlib ElementTree,
# deliberately, because the format every CI system reads should never be the
# thing that cannot be produced.
report = ["openpyxl>=3.1"]

# numpy and jiwer are dev dependencies as well as [audio] ones, deliberately.
# `lab.voice.perturb` is pure numpy and `lab.voice.wer` scores against jiwer, and
# a test that skips itself on a clean checkout is not a test a reviewer can read a
# verdict from. Both are offline, wheels-only installs — no network at test time,
# no API keys — so the cardinal rule still holds: `pip install -e ".[dev]" &&
# pytest` is green on a clean machine, and now it exercises those modules for
# real instead of skipping them. The library itself still runs without either:
# `wer` falls back to a built-in alignment, and nothing imports `perturb` eagerly.
# soundfile is here for the same reason numpy and jiwer are. The committed audio
# fixtures are 16 kHz mono Ogg Opus (see lab/voice/engines/audiofile.py for the
# arithmetic), and decoding Ogg Opus needs libsndfile >= 1.1, which soundfile
# ships prebuilt inside its wheel — no system package, no network at test time,
# no compiler. Without it every test that reads the real committed clips would
# skip itself, and a skipped test is not a verdict a reviewer can read. The library
# still works without it: `lab.voice.engines.audiofile` handles WAV with the
# standard library alone, and says so when it cannot honour an Opus request.
#
# matplotlib is here on the same argument, one step further. `make demo` is the
# two-minute tour, and two of the three artefacts it advertises — the handoff
# heatmap and the Pareto chart — are PNGs. With matplotlib only in [charts], the
# install the README tells a reviewer to run could never produce either of them,
# and the two heatmap tests skipped themselves. Both figures are drawn from
# committed data by offline code, so nothing about the cardinal rule changes;
# what changes is that the documented install now draws them. [charts] is kept
# as its own extra for anyone depending on the library who does not want a
# plotting stack pulled in.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Declared rather than installed ad-hoc in CI, so the linter a contributor runs
  # locally is the same version that gates the build. A lint that disagrees
  # between the two is a lint people learn to ignore.
  "ruff>=0.8",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "jiwer>=3.0",
  "soundfile>=0.12",
  "matplotlib>=3.8",
]
audio = [
  "jiwer>=3.0",
  "numpy>=1.26",
  "soundfile>=0.12",
]
# openpyxl is here rather than in the core dependencies because the corpus does not
# need it: YAML remains the committed, diffable source of truth and every test that
# loads a scenario loads it from YAML. The Excel path is an *authoring* surface for
# the people who write the scenarios — compliance and sales-training staff, who
# have a spreadsheet open all day and do not have a YAML editor — and it converts
# through exactly the same pydantic models, so there is no second rulebook to drift.
# Install it with `pip install -e ".[excel]"`. Without it, roleplay.excel_corpus
# raises a message saying that, and nothing else in the repository notices.
excel = [
  "openpyxl>=3.1",
]
charts = [
  "matplotlib>=3.8",
]
# The WebRTC transport tier's client, and the one extra deliberately NOT folded
# into [dev].
#
# Every other optional dependency in this file is in [dev] on the argument that a
# test which skips itself is not a verdict a reviewer can read. That argument does
# not reach here, and the reason is the cardinal rule rather than taste: the
# livekit client is a real-time networking stack that ships a prebuilt native
# binary per platform, and it is useless without a credential and a reachable
# server. Putting it in [dev] would make the documented install heavier for
# everybody and buy nothing, because the tests it enables still could not run —
# `LAB_LIVE_TRANSPORT` and three LiveKit variables gate them, and CI sets none of
# those.
#
# What keeps the tier honest instead is that its *measurements* need none of this.
# `lab/voice/transport/{records,measure,trace,report,rows}.py` are pure, the three
# live sessions are committed as recordings, and the offline suite recomputes every
# reported figure from them. So `pip install -e ".[dev]" && pytest` exercises the
# whole measurement path on a machine that has never heard of WebRTC; this extra is
# only needed to record a *new* session. See docs/AUDIO_TRANSPORT.md.
transport = [
  "livekit>=1.1",
  "livekit-api>=1.2",
]


[project.urls]
Homepage = "https://github.com/Pinglesagar/conversation-eval-lab"
Source = "https://github.com/Pinglesagar/conversation-eval-lab"

[tool.setuptools.packages.find]
include = ["lab*", "ragcheck*", "roleplay*"]
exclude = ["tests*", "fixtures*", "scenarios*", "error_analysis*"]

# The judge's prompts, labels and calibration reports are part of the library,
# not of the case study: `lab.judges.hallucinated_confirmation` reads its prompt
# text and its 24 labelled items off disk at run time. Only Python files land in
# a wheel by default, so without this the installed package was missing its own
# data and `evallab calibrate` died on a FileNotFoundError for prompt_v1.md.
# Editable installs never noticed, which is exactly why it went unseen. `lab` is
# meant to be extractable into its own distribution, and a distribution that
# cannot find its own prompts is not extractable.
[tool.setuptools.package-data]
lab = ["judges/**/*.md", "judges/**/*.json", "judges/**/*.jsonl"]
# Same reason as `lab` above, one domain along: `roleplay.calibration` reads the
# rubric off disk at run time to stamp its digest into every calibration report,
# and a wheel that could not find its own rubric would fail on the first call
# rather than at install.
roleplay = ["*.md"]

# Same argument, same failure mode, one package over: `ragcheck` reads its three
# judge prompts, its corpus, its 18-question evaluation set and its hand labels
# off disk at run time. Only Python files land in a wheel by default, so without
# this an installed copy could not answer a single question — and an editable
# install would never notice, which is exactly how the equivalent gap in `lab`
# went unseen.
ragcheck = ["prompts/*.md", "fixtures/*.yaml"]

[tool.ruff]
# Line length matches .editorconfig. Not 79: this repository's docstrings carry
# its reasoning and 79 columns turns every explanation into a ladder.
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# E9/F63/F7/F82 is the CI gate — syntax errors and undefined names only, nothing
# stylistic, because a lint that fails on taste teaches people to skip the lint.
# The wider set below runs in pre-commit, where a person can see it and fix it.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# SIM is deliberately OFF. Its rules are taste — "use a ternary", "collapse the
# nested if" — and several of them make this codebase worse, because the nested
# form has a comment between the two conditions explaining why they are separate.
# A linter that is sometimes wrong gets ignored, and then it catches nothing.
ignore = [
    # A long line inside a docstring is prose, and rewrapping prose to satisfy a
    # linter makes it worse.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# F811 in tests is pytest's fixture pattern, not a bug: a test function takes a
# parameter named after the fixture that supplies it, which ruff reads as a
# redefinition of the module-level fixture function. Silencing it per-file is
# correct; silencing it globally would hide a real redefinition in library code.
"tests/*" = ["B011", "F811"]

# F401 in a package __init__ is the re-export pattern. These files exist to
# publish names, and every one of them is listed in __all__ — which is the
# assertion that it is deliberate.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
# Not `strict`. This repository is read more than it is extended, and the value
# of type checking here is catching a wrong attribute name, not proving totality.
# `strict` on a codebase with this much dynamic YAML loading produces a hundred
# ignores, and a hundred ignores is the same as no type checking with extra steps.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ['build/', '\.venv/']

[[tool.mypy.overrides]]
# These have no stubs and are used at the edges only.
module = ["litellm.*", "soundfile.*", "jiwer.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: hits a real network provider; skipped unless the relevant opt-in env var is set.",
]

# All seven packages, not three. The previous list named `lab`, `roleplay` and
# three-sevenths of the tree and got a figure whose denominator was silently
# wrong — the exact defect this repository spends most of its energy refusing to
# ship. `scripts` is in the list even though five of its modules need vendor keys
# and can never run offline: excluding them would raise the headline number by
# hiding code, which is the wrong direction. `make coverage` prints both the
# whole-tree figure and the figure with those five omitted, and says which is
# which.
[tool.coverage.run]
branch = true
source = [
  "lab",
  "roleplay",
  "ragcheck",
  "scenarios",
  "error_analysis",
  "scripts",
]
