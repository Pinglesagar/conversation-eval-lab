# CI, with no secrets and no network calls at test time.
#
# The cardinal rule of this repository is that everything runs with zero API
# keys, and this file is where that stops being a claim. There is no `secrets`
# block, no provider credential, and no step that would behave differently if one
# existed: every live path is opt-in behind a `LAB_LIVE_*` variable that is never
# set here, and each has a recorded fixture that replays instead.
#
# Five things are gated, in this order, because each makes the next believable:
#
#   1. lint — syntax errors and undefined names, nothing stylistic
#   2. the corpus validates against its schema, so a typo is a load error
#   3. the judge calibration runs, and the artefacts it writes are unchanged
#   4. the five scenarios, the recorded spoken call and the retrieval pack all
#      reproduce from their recordings
#   5. the offline suite
#
# Step 3 is the interesting one. The calibration writes into the same files that
# are committed, and `git diff --exit-code` then fails if a single byte moved.
# That is a stronger claim than "the tests pass": it says this run of this code
# reproduces the artefact a reviewer read, on a different machine, to the byte.
#
# Note that the run reports failures and the build is still green. The system
# under test has three deliberately seeded defects and the report is not allowed
# to hide them. The build is green because every failure was DECLARED by the
# corpus in advance; an undeclared one fails the job. See DESIGN.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline suite, gates and the five scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report]"

      # E9/F63/F7/F82 only: syntax errors and undefined names. Nothing
      # stylistic gates the build — a lint that fails on taste teaches people to
      # skip the lint. The wider set runs in pre-commit where a person can see it.
      - name: Lint — syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 --exclude .venv .

      - name: Validate the scenario corpus
        run: python -m roleplay.corpus --coverage --list

      - name: Judge calibration
        run: python -m lab.judges.hallucinated_confirmation

      - name: Calibration artefacts are unchanged
        run: git diff --exit-code -- fixtures lab/judges

      - name: The five scenarios
        run: python -m roleplay.demo

      - name: The recorded spoken call replays and re-grades
        run: python -m roleplay.spoken

      - name: The retrieval pack
        run: python -m ragcheck

      - name: Tests
        run: pytest -q --junit-xml=reports/pytest-junit.xml

      - name: Run reports — JUnit XML for CI, Excel for triage
        if: always()
        run: python -m roleplay.demo --report reports --label "${{ github.sha }}"

      # The standard thing to do with a JUnit file: publish it so failures show
      # on the PR itself rather than only inside a log nobody opens.
      - name: Publish the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/pytest-junit.xml
            reports/results.xlsx
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm no key was needed
        run: |
          echo "Live paths are opt-in and none were enabled. Asserting that:"
          ! env | grep -q '^LAB_LIVE_' || (echo "a LAB_LIVE_* variable is set in CI" && exit 1)
          echo "  no LAB_LIVE_* variable is set — every tier above replayed."
