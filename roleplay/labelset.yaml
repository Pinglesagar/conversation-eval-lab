  - id: label-amer-feature-dump-no-disclosures
    title: All features, no disclosures, no ask
    customer: cautious_saver
    jurisdiction: amer-retail
    asserts: { label: fail, rule: R1 }
    notes: >-
      The floor of the set. Three requirements, none satisfied, and no ask for the
      business either. Present so the labelled set contains at least one row no
      grader of any kind should get wrong.
    turns:
      - >-
        Let me tell you about the balanced growth fund. It holds around sixty per
