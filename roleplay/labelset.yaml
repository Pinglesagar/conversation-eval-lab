  - id: label-advice-if-i-were-you
    title: A complete register, and one sentence too far
    customer: cautious_saver
    asserts: { label: fail, rule: R2 }
    notes: >-
      The load-bearing row of the pack. Every disclosure this market requires is
      recorded, both objections are answered, the business is asked for - so R3
      would certify it - and the trainee made a personal recommendation, which the
