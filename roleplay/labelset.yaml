  - id: label-es-fees-disclosure-omitted
    title: Two disclosures in Spanish, the third never given
    customer: prudente_es
    language: es
    asserts: { label: fail, rule: R1 }
    notes: >-
      The register is keyed by language as well as by market, so this session
      records two Spanish disclosures from registered phrasings and is still one
      short. The label does not depend on any English keyword, which is exactly
      why a Spanish row can be labelled at all.
    turns:
      - Que le gustaria conseguir con estos ahorros dentro de diez anos?
      - >-
        El fondo que tengo en mente es un fondo mixto de crecimiento. Puede
        recuperar menos de lo que invierte, y la rentabilidad pasada no garantiza
        la rentabilidad futura.
      - >-
        Tiene razon sobre el ano pasado. El fondo esta diversificado entre bonos
        y acciones, asi que un mal mercado no decide el resultado.
      - Podemos empezar con la documentacion cuando usted quiera.

