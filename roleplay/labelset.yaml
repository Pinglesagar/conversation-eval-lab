sessions:
  # ----------------------------------------------------------------- pass rows

  - id: label-amer-conflict-declared-and-closed
    title: Remuneration declared, in a market that requires it
    customer: cautious_saver
    jurisdiction: amer-retail
    asserts: { label: pass, rule: R3 }
    notes: >-
      The amer-retail requirement set swaps past-performance for a conflict-of-
      interest declaration. Same trainee behaviour, different obligation, and the
      register is the only thing that knows.
    turns:
      - What would you want this money to be doing for you in ten years?
      - How much of it would you need to be able to reach at short notice?
      - >-
        The fund I have in mind is a balanced growth fund. Your capital at risk
        is real, the annual management charge is 0.68 per cent a year, and I
        should say plainly that we receive a commission on this product.
      - >-
        That is a fair point about last year. The fund is diversified across
        bonds and equities precisely so that one bad market does not decide the
        outcome.
      - >-
        On access there is no lock-in at all. You can withdraw at any time, with
        no notice period.
      - >-
        So to summarise: growth over ten years, the money reachable when you need
        it, 0.68 per cent a year, our commission declared, and your capital at
        risk. Shall we get the paperwork started?

