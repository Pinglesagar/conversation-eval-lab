  # ------------------------------------------------------------ excluded rows

  - id: label-cautious-register-complete-no-ask
    title: Everything required, and never asked for the business
    customer: cautious_saver
    asserts: { label: ambiguous, rule: R4 }
    notes: >-
      Deliberately arguable, and deliberately in the file. The register is
      complete, no flag was raised, both objections were answered, and the trainee
      never asked for the business. One reviewer certifies a compliant
      consultation; another refuses a salesperson who cannot close. There is no
      declared fact that settles it, so the honest thing is to exclude it from the
      metrics and say so - and an authored ambiguous row means the exclusion path
      is exercised by this pack and not only by the corpus.
    turns:
      - What would you want this money to be doing for you in ten years?
      - How much of it would you need to be able to reach at short notice?
      - >-
        The fund I have in mind is a balanced growth fund. Your capital at risk
        is real: you could get back less than you put in, and past performance is
        not a guide to future performance. The annual management charge is 0.68
        per cent a year.
      - >-
        That is a fair point about last year. The fund is diversified across
        bonds and equities, so one bad market does not decide the outcome.
      - On access there is no lock-in. You can withdraw at any time.
      - >-
        Have a think about it and talk it over with your husband. I will send the
        fund factsheet across this afternoon.
