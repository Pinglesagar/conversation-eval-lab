        Shall we get the paperwork started?

  - id: label-aggressive-both-objections-answered
    title: A combative customer, both objections engaged
    customer: aggressive_challenger
    asserts: { label: pass, rule: R3 }
    notes: >-
      The aggressive profile re-raises whatever is still unhandled, so an
      unresolved objection stays visible in the ledger. This row answers both,
      which is what makes it a pass rather than an R4 exclusion.
    turns:
      - What brought you in today, and what would you want this money to do?
      - >-
        The fund I have in mind is a balanced growth fund. Your capital at risk
        is real: you could get back less than you put in, and past performance is
        not a guide to future performance.
      - >-
        On cost, the annual management charge is 0.68 per cent a year and there
        is nothing else on top - that is the total cost of holding it.
      - >-
        You are right to ask. We receive a commission on this product, and there
        is no obligation on you today either way.
      - >-
        So to summarise: capital at risk, 0.68 per cent a year all in, and our
        commission declared. Shall we get the paperwork started?

  - id: label-reluctant-two-probes-then-close
    title: A monosyllabic customer, asked twice
    customer: reluctant_minimal
    asserts: { label: pass, rule: R3 }
    notes: >-
      This profile needs two open probes before a concern surfaces. The row is
      here for the register and the ask, not for the discovery criterion, but it
      is written so the discovery a reviewer would credit actually happened.
    turns:
      - What would you want this money to be doing for you in a few years?
      - How would you feel if it dropped ten per cent in a bad year?
      - >-
        Understood. The fund I have in mind is a balanced growth fund: your
        capital at risk is real, past performance is not a guide to future
        performance, and the annual management charge is 0.68 per cent a year.
      - >-
        It is one fund rather than a portfolio to manage - that is the whole of
        it, in plain terms.
      - >-
        So to summarise: one fund, 0.68 per cent a year, capital at risk, and you
        can leave whenever you want. Shall we get the paperwork started?

  - id: label-cautious-register-complete-second-wording
    title: The register's alternate phrasings, all three
    customer: cautious_saver
    asserts: { label: pass, rule: R3 }
    notes: >-
      Every disclosure here uses the second or third registered phrasing rather
