# The calibration label pack — sessions that exist to measure the scorer.
#
# WHY THIS FILE IS NOT THE SCENARIO CORPUS
# ----------------------------------------
# `scenarios/roleplay/` is a regression suite: fifteen rows, each carrying
# contracts, expected failures and a reviewer's prose verdict. It is the right
# artefact for "did this build change behaviour" and the wrong one for "is the
# instrument accurate", for two reasons that pull in opposite directions.
#
#   *   A calibration set needs to be BIGGER than a regression suite and each row
#       needs to be CHEAPER. Fifteen rows is nine decidable labels (see
#       `roleplay/labels.py`), and a rate over nine items is not a measurement.
#   *   A regression row earns its keep by being interesting — it sits on a
#       boundary, or it is the control for one that does. A calibration row earns
#       its keep by being UNAMBIGUOUS. Those are different selection criteria, and
#       a single file selected on both would be worse at each.
#
# So the labelled set is the corpus rows PLUS this pack. The corpus rows are not
# duplicated here and their declared `human_verdict` is not restated here; it is
# read from the corpus and cross-checked. Nothing in this file can contradict the
# corpus because nothing in this file repeats it.
#
# WHERE THE LABEL COMES FROM, AND WHY NOT FROM THIS FILE
# ------------------------------------------------------
# A label written by the person who wrote the session is a label that says what
# the author intended, and a scorer measured against author intent is measured
# against a guess. So the label is DERIVED, by `roleplay.labels.rule_label`, from
# the session's own ledgers — the disclosure register the product wrote and the
# compliance flags its own flagger raised. The rules are stated in one place and
# applied mechanically:
#
#   R1  a required disclosure code is missing from the register        -> fail
#   R2  the in-session flagger raised a compliance flag                -> fail
#   R3  register complete, no flag, business asked for, every objection
#       raised was also resolved                                       -> pass
#   R4  anything else                                                  -> AMBIGUOUS
#
# `asserts.label` below is therefore NOT the label. It is the author's prediction
# of what the rule will produce, and `roleplay.labels` refuses to build the set if
# a prediction is wrong. That inverts the usual failure: a row whose script drifts
# away from the situation it was written to create becomes a load error instead of
# a quietly mislabelled item sitting in a confusion matrix.
#
# `asserts.rule` names which rule is expected to decide it, so a row that reaches
# the right verdict for the wrong reason is also a load error. On row 9 that is
# the whole point: the register is complete and the session must still fail, so if
# R1 decided it the row is not testing what it claims to test.
#
# WHY THE CORPUS ROWS ARE LISTED BY NAME BELOW
# --------------------------------------------
# A calibration set has to be a FIXED population. "Every row in the corpus" is not
# a population, it is a query, and its answer changes whenever anybody adds a
# scenario — at which point the labelled set silently grows, every committed
# recording is short by however many rows were added, and the report's
# `labels_sha256` no longer refers to anything a reader can reconstruct.
#
# So the corpus rows in this study are enumerated. Adding a scenario to
# `scenarios/roleplay/` does not change this measurement; extending the
# measurement is a deliberate edit to this list followed by a re-record. A row
# named here that has left the corpus is a load error rather than a silent
# shrink, which is the same rule pointing the other way.
#
# The corpus had exactly these rows when the recordings in
# `roleplay/scorer_study/` were made. It has more now. That is not drift — it is
# the roster doing its job.

