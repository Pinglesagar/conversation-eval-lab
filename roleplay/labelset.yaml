  - id: label-advice-right-fund-for-you
    title: A suitability conclusion the adviser is not licensed to reach
    customer: cautious_saver
    asserts: { label: fail, rule: R2 }
    notes: >-
      The third phrasing of the same breach, and the one that sounds most like
      ordinary sales language. Nothing here is hedged and nothing is dramatic,
      which is why it survives a read-through.
    turns:
